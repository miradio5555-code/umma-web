<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Заменяется значением `flutter build web --base-href`. -->
  <base href="/umma-web/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Умма — намаз, Коран, зикр">
  <meta name="theme-color" content="#000000">

  <!-- iPhone: открывается с экрана «Домой» без панелей Safari. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Умма">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Умма</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    /* Пока грузится приложение — значок и тихая полоска, а не пустой экран. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(circle at 50% 42%, #14206a 0%, #000 62%);
      transition: opacity .25s ease;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255, 255, 255, .12);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #8ab0ff; border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Умма загружается">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
